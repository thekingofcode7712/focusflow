id: com.tmp.FocusFlow
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: focusflow

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-data/com.tmp.FocusFlow:create

modules:
  - name: focusflow
    buildsystem: simple
    build-commands:
      - install -Dm755 src/focusflow.py /app/bin/focusflow
      - install -Dm644 com.tmp.FocusFlow.desktop /app/share/applications/com.tmp.FocusFlow.desktop
      - install -Dm644 com.tmp.FocusFlow.metainfo.xml /app/share/metainfo/com.tmp.FocusFlow.metainfo.xml
      - install -Dm644 icons/com.tmp.FocusFlow.svg /app/share/icons/hicolor/scalable/apps/com.tmp.FocusFlow.svg
    sources:
      - type: dir
        path: .
